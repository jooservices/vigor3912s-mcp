name: E2E

on:
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (simulated DrayOS, all tools)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout MCP
        uses: actions/checkout@v7
        with:
          path: vigor3912s-mcp
          persist-credentials: false

      - name: Clone sibling dependencies
        working-directory: ${{ github.workspace }}
        env:
          SSH_CLIENT_REF: ${{ vars.SSH_CLIENT_REF || 'develop' }}
          VIGOR_SDK_REF: ${{ vars.VIGOR_SDK_REF || 'develop' }}
          VIGOR_SDK_REPO: ${{ vars.VIGOR_SDK_REPO || 'https://github.com/jooservices/vigor3912s-sdk.git' }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${SSH_CLIENT_REF}" \
            https://github.com/jooservices/ssh-client.git ssh-client
          if ! git ls-remote --exit-code "${VIGOR_SDK_REPO}" "refs/heads/${VIGOR_SDK_REF}" >/dev/null 2>&1 \
            && ! git ls-remote --exit-code "${VIGOR_SDK_REPO}" "refs/tags/${VIGOR_SDK_REF}" >/dev/null 2>&1; then
            echo "::error::Missing sibling SDK repo at ${VIGOR_SDK_REPO} (ref ${VIGOR_SDK_REF})."
            exit 1
          fi
          git clone --depth 1 --branch "${VIGOR_SDK_REF}" "${VIGOR_SDK_REPO}" vigor3912s-sdk

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            vigor3912s-mcp/package-lock.json
            ssh-client/package-lock.json
            vigor3912s-sdk/package-lock.json

      - name: Install and build
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          (cd ssh-client && npm ci && npm run build)
          (cd vigor3912s-sdk && npm ci && npm run build)
          (cd vigor3912s-mcp && npm ci && npm run build)

      - name: E2E against simulated DrayOS server (all tools, writes included)
        working-directory: vigor3912s-mcp
        run: npm run e2e:testing
