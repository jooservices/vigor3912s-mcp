name: CI

on:
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout MCP
        uses: actions/checkout@v7
        with:
          path: vigor3912s-mcp
          persist-credentials: false

      - name: Clone sibling dependencies
        working-directory: ${{ github.workspace }}
        env:
          # Pin or override via repo variable; default develop tip (shallow).
          SSH_CLIENT_REF: ${{ vars.SSH_CLIENT_REF || 'develop' }}
          VIGOR_SDK_REF: ${{ vars.VIGOR_SDK_REF || 'develop' }}
          VIGOR_SDK_REPO: ${{ vars.VIGOR_SDK_REPO || 'https://github.com/jooservices/vigor3912s-sdk.git' }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${SSH_CLIENT_REF}" \
            https://github.com/jooservices/ssh-client.git ssh-client
          if ! git ls-remote --exit-code "${VIGOR_SDK_REPO}" "refs/heads/${VIGOR_SDK_REF}" >/dev/null 2>&1 \
            && ! git ls-remote --exit-code "${VIGOR_SDK_REPO}" "refs/tags/${VIGOR_SDK_REF}" >/dev/null 2>&1; then
            echo "::error::Missing sibling SDK repo at ${VIGOR_SDK_REPO} (ref ${VIGOR_SDK_REF})."
            echo "::error::Create/publish jooservices/vigor3912s-sdk (or set vars.VIGOR_SDK_REPO) so CI can git clone file:../vigor3912s-sdk."
            exit 1
          fi
          git clone --depth 1 --branch "${VIGOR_SDK_REF}" "${VIGOR_SDK_REPO}" vigor3912s-sdk

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            vigor3912s-mcp/package-lock.json
            ssh-client/package-lock.json
            vigor3912s-sdk/package-lock.json

      - name: Install and build siblings
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          (cd ssh-client && npm ci && npm run build)
          (cd vigor3912s-sdk && npm ci && npm run build)
          (cd vigor3912s-mcp && npm ci)

      - name: CI (lint + tests + build)
        working-directory: vigor3912s-mcp
        run: npm run ci

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks OSS CLI
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source=/repo --verbose --redact --config=/repo/.gitleaks.toml
